services:
  - type: web
    name: research-intel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "Research Funding & Innovation Intelligence Platform"
      - key: API_V1_STR
        value: "/api/v1"
      - key: DATABASE_URL
        fromDatabase:
          name: research-intel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app"]'
      - key: ADMIN_EMAIL
        value: "admin@platform.edu"
      - key: ADMIN_PASSWORD
        value: "AdminPassword123!"
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: research-intel-db
    plan: free
    databaseName: research_intel_db
